[package]
name = "time-block-planner"
version = "1.0.0"
description = "Offline daily time blocking desktop app"
authors = ["Time Block Planner"]
edition = "2021"

[lib]
name = "time_block_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
